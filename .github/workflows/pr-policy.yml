name: pr-policy

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue linkage and labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const https = require('node:https');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pull = event.pull_request;
          const body = pull.body || '';
          const matches = [...body.matchAll(/\b(?:closes|fixes|resolves)\s+#(\d+)\b/gi)];
          if (matches.length !== 1) {
            throw new Error('PR body must contain exactly one Closes/Fixes/Resolves #N reference.');
          }
          const issueNumber = matches[0][1];
          const labels = (pull.labels || []).map((label) => label.name);
          const typeLabels = labels.filter((label) => label.startsWith('type:'));
          if (typeLabels.length !== 1) {
            throw new Error(`PR must have exactly one type:* label; found ${typeLabels.length}.`);
          }

          function request(path) {
            return new Promise((resolve, reject) => {
              const request = https.request({
                hostname: 'api.github.com',
                path,
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  'User-Agent': 'ai-engineering-pr-policy',
                },
              }, (response) => {
                let data = '';
                response.on('data', (chunk) => { data += chunk; });
                response.on('end', () => {
                  if (response.statusCode !== 200) reject(new Error(`GitHub API returned ${response.statusCode}`));
                  else resolve(JSON.parse(data));
                });
              });
              request.on('error', reject);
              request.end();
            });
          }

          request(`/repos/${process.env.REPOSITORY}/issues/${issueNumber}`)
            .then((issue) => {
              const issueLabels = (issue.labels || []).map((label) => typeof label === 'string' ? label : label.name);
              if (!issueLabels.includes('status:approved')) {
                throw new Error(`Linked issue #${issueNumber} lacks status:approved.`);
              }
              console.log(`Validated issue #${issueNumber} and label ${typeLabels[0]}.`);
            })
            .catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
