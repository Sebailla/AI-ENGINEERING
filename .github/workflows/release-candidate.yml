name: release-candidate

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "SemVer expected in package.json and CHANGELOG.md"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed delivery branch
        if: github.ref_name != 'feat/p0-harness-bootstrap'
        run: |
          echo "### Release candidate: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "Release candidates must run from feat/p0-harness-bootstrap; got ${{ github.ref_name }}." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate gates
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          actual_version=$(node -p "require('./package.json').version")
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "Expected version $EXPECTED_VERSION but package.json is $actual_version" >&2
            exit 1
          fi
          pnpm typecheck
          pnpm test
          pnpm package:audit
          pnpm release:check

      - name: Build candidate tarball and digest
        id: package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-candidate"
          pnpm pack --pack-destination "$RUNNER_TEMP/release-candidate" --json > "$RUNNER_TEMP/release-candidate/metadata.json"
          tarball=$(find "$RUNNER_TEMP/release-candidate" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          (cd "$RUNNER_TEMP/release-candidate" && sha256sum "$(basename "$tarball")" | tee SHA256SUMS)
          echo "### Release candidate: VERIFICADO" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate tarball and SHA-256 digest prepared; no registry publication was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-candidate-${{ inputs.expected_version }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
